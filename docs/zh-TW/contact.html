    <script>
        $(function() {
          const currentLang = "zh_TW" || "en"; 
          const contactData = [{"id":"phone","icon":"fa-phone","link":"tel:+852-27686811","title":"Telephone","label":{"en":"Phone","zh_TW":"電話","zh_CN":"电话"},"value":"+852-27686811"},{"id":"fax","icon":"fa-fax","link":"tel:+852-24062376","title":"Fax","label":{"en":"Fax","zh_TW":"傳真","zh_CN":"传真"},"value":"+852-24062376"},{"id":"email","icon":"fa-envelope","link":"mailto:%EMAIL%","title":"Email","label":{"en":"Email","zh_TW":"電子郵件","zh_CN":"电子邮件"},"value":"%EMAIL%"},{"id":"address","icon":"fa-map","link":null,"title":"","label":{"en":"Address","zh_TW":"地址","zh_CN":"地址"},"value":{"en":"A0336, Department of Electronic Engineering and Computer Science, School of Science and Technology, Hong Kong Metropolitan University, Ho Man Tin, Kowloon, Hong Kong","zh_TW":"香港九龍何文田香港都會大學科技學院電子工程及計算機科學系A0336","zh_CN":"香港九龙何文田香港都会大学科技学院电子工程及计算机科学系A0336"}}];
          const $container = $('#contact-container');
          $container.empty();
        
          const CONTACT_EMAIL = "ylliu@hkmu.edu.hk";
          contactData.forEach(item => {
            const localizedLabel = item.label[currentLang] || item.label['en'];
        
            let localizedValue = "";
            if (typeof item.value === 'object') {
              localizedValue = item.value[currentLang] || item.value['en'];
            } else {
              localizedValue = item.value.replace(/%EMAIL%/g, CONTACT_EMAIL);
            }
            
            let contentHtml = '';
            if (item.link) {
              rsEmail = item.link.replace(/%EMAIL%/g, CONTACT_EMAIL);
              contentHtml = `<a href="${rsEmail}" title="${currentLang === 'en' ? item.title : localizedLabel}" target="_blank">${localizedValue}</a>`;
            } else {
              contentHtml = localizedValue;
            }
        
            const $p = $('<p></p>').append(
              `<i class="fa ${item.icon} mr-2"></i>\n`,
              `${localizedLabel}：`,
              contentHtml
            );
        
            $container.append($p);
          });
        });
    </script>
