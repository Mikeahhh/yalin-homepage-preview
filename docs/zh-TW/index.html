    <script>
        // 1. 透過 Jekyll 讀取 _data/biography.json 並轉成 JS 物件
        let currentLang = "zh_TW";
        let bioJson = {"en":["Dr. Liu is currently a senior lecturer at the School of Science and Technology, Hong Kong Metropolitan University. She received her Ph.D degree from Macau University of Science and Technology in 2022. From Jan. 2022 to May 2022, she worked as a research assistant at the Education University of Hong Kong. From June 2022 to Dec. 2024, she worked as a Lecturer at Hong Kong Metropolitan University. Her research interests include Space-Air-Ground Integrated Networks, IoT, Blockchain-enabled wireless networks, Web 3.0, Movable Antenna systems, ISAC, and AI solutions for Networks.","Dr. Liu has led projects worth over HKD 12.4 million as project PI and Co-I, successfully securing 8 grants from the Hong Kong RGC and HKMU R&D. She has published some papers in top-tier journals and conferences including IEEE Journal on Selected Areas in Communications (JCR Q1), IEEE Transactions on Vehicular Technology (JCR Q1), IEEE Network (JCR Q1), IEEE ICC (EI and CCF C conference), IEEE GLOBECOM (EI and CCF C conference) and IEEE Wireless Communications Letters (JCR Q1). One of her papers, “Unmanned Aerial Vehicle for Internet of Everything: Opportunities and Challenges,” has received a high citation rate of 280 on Google Scholar as of 19 August, 2025. She received the Katie Shu Sui Pui Charitable Trust – Outstanding Research Publication Award in 2025. Her invention “Facilitating Emotion Classification Based on Non-Intrusive Learner Data via Deep Neural Networks” was awarded a Gold Medal in iCAN 2022.","Dr. Liu has served as a Technical Program Committee (TPC) member for conferences such as IEEE WCNC and IEEE VTC, and as a reviewer for various IEEE journals, including IEEE IoT and IEEE Communications Magazine. She is also serving as a Special Issue Editor for MDPI Electronics and MDPI Network."],"zh_CN":["刘博士目前任香港都会大学科技学院高级讲师。2022年于澳门科技大学取得博士学位。2022年1月至2022年5月于香港教育大学担任研究助理。2022年6月至2024年12月在香港都会大学担任讲师。她的研究兴趣包括空天地一体化网络、物联网、区块链赋能无线网络、Web 3.0、可移动天线系统、通感一体化（ISAC）和网络人工智能解决方案等。","刘博士以 PI 和 Co-I 身份承担了总价值超过1,240万港元的项目，成功从香港研究资助局（RGC）和香港都会大学（HKMU）研发部门获得了8项资助。她在顶尖期刊和会议上发表了一些论文，包括 IEEE Journal on Selected Areas in Communications（JCR Q1）、IEEE Transactions on Vehicular Technology（JCR Q1）、IEEE Network（JCR Q1）、IEEE ICC（EI 收录、CCF C 类会议）、 IEEE GLOBECOM（EI 收录、CCF C 类会议）和 IEEE Wireless Communications Letters (JCR Q1)。她的一篇论文「无人机赋能万物互联：机遇与挑战」截至2025年8月19日在 Google Scholar 上的引用次数达280次。她于2025年获得了舒小佩慈善基金—杰出研究著作奖。她的发明「通过深度神经网络促进基于非侵入式学习者数据的情绪分类」在2022年iCAN大会上荣获金奖。","刘博士曾担任IEEE WCNC和IEEE VTC等会议的技术程序委员会（TPC）成员，并为多个IEEE期刊（如《IEEE IoT》和《IEEE Communications Magazine》）担任审稿人。她目前还担任MDPI Electronics和MDPI Network的特刊编辑。"],"zh_TW":["劉博士目前任香港都會大學科技學院高級講師。2022年於澳門科技大學取得博士學位。2022年1月至2022年5月於香港教育大學擔任研究助理。2022年6月至2024年12月在香港都會大學擔任講師。她的研究興趣包括空天地一體化網絡、物聯網、區塊鏈賦能無線網絡、Web 3.0、可移動天線系統、通感一體化（ISAC）和人工智能賦能網絡解決方案等。","劉博士以 PI 及 Co-I 身份承擔了總價值超過1,240萬港元的項目，成功從香港研究資助局（RGC）及香港都會大學（HKMU）研發部門獲得了8項資助。她在頂尖期刊和會議上發表了一些論文，包括 IEEE Journal on Selected Areas in Communications（JCR Q1）、IEEE Transactions on Vehicular Technology（JCR Q1）、IEEE Network（JCR Q1）、IEEE ICC（EI 收錄、CCF C 類會議）、 IEEE GLOBECOM（EI 收錄、CCF C 類會議）和 IEEE Wireless Communications Letters (JCR Q1)。她的一篇論文「無人機賦能萬物互聯：機遇與挑戰」截至2025年8月19日在 Google Scholar 上的引用次數達280次。她於2025年獲得了舒小佩慈善基金—傑出研究著作獎。她的發明「通過深度神經網絡促進基於非侵入式學習者數據的情緒分類」在2022年iCAN大會上榮獲金獎。","劉博士曾擔任IEEE WCNC和IEEE VTC等會議的技術程序委員會（TPC）成員，並為多個IEEE期刊（如《IEEE IoT》和《IEEE Communications Magazine》）擔任審稿人。她目前也擔任MDPI Electronics和MDPI Network的特刊編輯。"]};
        let bioData = bioJson[currentLang] || bioJson['en'];
    
        // 2. 將 Array 中的 3 個段落渲染到網頁上
        const container = document.getElementById('bio-content');
        
        bioData.forEach(paragraphText => {
            const p = document.createElement('p');
            paragraphText = paragraphText.replace(/(Dr. Liu|劉博士|刘博士)/g, '<span class="highlight">$1</span>');
            paragraphText = paragraphText.replace(/(a senior lecturer|高級講師|高级讲师)/g, '<a href="https://www.hkmu.edu.hk/st/people/key-staff/staff-profile/?email=ylliu&unit=S&T&po=N" target="_blank">$1</a>');
            paragraphText = paragraphText.replace(/(MDPI Electronics)/g, '<a href="https://www.mdpi.com/journal/electronics/special_issues/71DW63SS34" target="_blank">$1</a>');
            paragraphText = paragraphText.replace(/(MDPI Network)/g, '<a href="https://www.mdpi.com/journal/network/special_issues/DCLNS956JH" target="_blank">$1</a>');
            p.innerHTML = paragraphText;
            container.appendChild(p);
        });
    </script>
